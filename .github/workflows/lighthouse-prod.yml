# Runs daily at 04:00 UTC. Previously triggered on every production deploy via
# deployment_status, which created a feedback loop: each audit committed README
# scores → triggered a new deploy → triggered another audit. Switched to cron
# to decouple from deploy frequency.
name: Lighthouse Audit (harrychang.me)

on:
  schedule:
    - cron: "0 4 * * *"

jobs:
  lighthouse-prod:
    name: Lighthouse CI (harrychang.me Production Deployment)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: read

    steps:
      # Check out main so the README commit lands on the current tip of main
      # without a non-fast-forward push.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Install workspace deps so the README commit uses the repo's pinned
      # Prettier version (matches the simulated CI's formatting exactly).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit the canonical public domain — the URL real users hit (custom
      # domain + Vercel CDN edge), with no preview-auth or deployment-protection
      # redirects.
      - name: Build URL list
        id: urls
        env:
          DEPLOY_URL: https://harrychang.me
        run: |
          PATHS=(
            "/"
            "/blog"
            "/projects"
            "/gallery"
            "/uses"
            "/cv"
            "/linktree"
            "/design"
            "/paper-reading"
            "/manifesto"
            "/projects/2025_04_12_portfolio"
            "/projects/2024_09_23_chingshin_rag"
            "/projects/2025_03_08_sitcon_keynote"
            "/projects/2025_08_04_debate"
            "/projects/2024_08_19_classics_reimagined"
            "/gallery/2026_02_08_italy_mountain"
            "/gallery/2023_07_07_splash_of_red"
            "/gallery/2023_10_06_against_giants"
            "/gallery/2023_11_18_dusk_impressions"
            "/gallery/2024_01_06_hehuanshan"
            "/blog/9_m11d"
            "/blog/2025_12_19_xpro1"
            "/blog/2025_12_22_aftersun_paris_texas"
            "/blog/2026_01_10_plushies"
            "/blog/2026_02_10_synecdoche_truman"
            "/graph"
          )
          {
            echo "list<<EOF"
            for p in "${PATHS[@]}"; do
              echo "${DEPLOY_URL}${p}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI (Mobile, against live deployment)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.list }}
          configPath: apps/harrychang-me/.lighthouserc.mobile.json
          artifactName: lighthouse-results-prod-mobile
          uploadArtifacts: true
          temporaryPublicStorage: true

      # lhci writes to .lighthouseci/; treosh/lighthouse-ci-action@v12 has no
      # input to redirect that. Move mobile LHRs aside so the desktop run
      # doesn't clobber them.
      - name: Move mobile LHRs out of .lighthouseci
        run: |
          if [ -d .lighthouseci ]; then
            rm -rf .lighthouseci-mobile
            mv .lighthouseci .lighthouseci-mobile
          fi

      - name: Run Lighthouse CI (Desktop, against live deployment)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.list }}
          configPath: apps/harrychang-me/.lighthouserc.json
          artifactName: lighthouse-results-prod-desktop
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Update README with production Lighthouse badges
        env:
          DEPLOYMENT_URL: https://harrychang.me
        run: node .github/scripts/update-lighthouse-readme.js --mode=prod

      - name: Format README with Prettier
        run: npx prettier --write apps/harrychang-me/README.md

      # Rebase onto latest main before the auto-commit pushes, in case
      # another job (e.g. lighthouse.yml) updated main during this run.
      - name: Rebase README change onto latest main
        run: |
          cp apps/harrychang-me/README.md /tmp/README.lh.md
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/README.lh.md apps/harrychang-me/README.md

      - name: Commit production Lighthouse changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): daily lighthouse audit — update README scores [skip ci]"
          file_pattern: "apps/harrychang-me/README.md"
          branch: main
