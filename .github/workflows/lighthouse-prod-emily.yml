# Runs daily at 04:00 UTC. Previously triggered on every production deploy via
# deployment_status, which created a feedback loop: each audit committed README
# scores → triggered a new deploy → triggered another audit. Switched to cron
# to decouple from deploy frequency.
name: Lighthouse Audit (emilychang.me)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  lighthouse-prod-emily:
    name: Lighthouse CI (emilychang.me Production Deployment)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: read

    steps:
      # Check out main so the README commit lands on the current tip of main
      # without a non-fast-forward push.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Install workspace deps so the README commit uses the repo's pinned
      # Prettier version (matches the simulated CI's formatting exactly).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit the canonical public domain — the URL real users hit (custom
      # domain + Vercel CDN edge).
      - name: Build URL list
        id: urls
        env:
          DEPLOY_URL: https://emilychang.me
        run: |
          PATHS=(
            "/"
            "/linktree"
          )
          {
            echo "list<<EOF"
            for p in "${PATHS[@]}"; do
              echo "${DEPLOY_URL}${p}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI (Mobile, against live deployment)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.list }}
          configPath: apps/harrychang-me/.lighthouserc.mobile.json
          artifactName: lighthouse-results-prod-emily-mobile
          uploadArtifacts: true
          temporaryPublicStorage: true

      # lhci writes to .lighthouseci/; treosh/lighthouse-ci-action@v12 has no
      # input to redirect that. Move mobile LHRs aside so the desktop run
      # doesn't clobber them.
      - name: Move mobile LHRs out of .lighthouseci
        run: |
          if [ -d .lighthouseci ]; then
            rm -rf .lighthouseci-mobile
            mv .lighthouseci .lighthouseci-mobile
          fi

      - name: Run Lighthouse CI (Desktop, against live deployment)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.list }}
          configPath: apps/harrychang-me/.lighthouserc.json
          artifactName: lighthouse-results-prod-emily-desktop
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Update README with production Lighthouse badges
        env:
          DEPLOYMENT_URL: https://emilychang.me
        run: node .github/scripts/update-lighthouse-readme.js --mode=prod --site=emily --readme=apps/emilychang-me/README.md

      - name: Format README with Prettier
        run: npx prettier --write apps/emilychang-me/README.md

      # Lighthouse runs are long; main may have moved during this window
      # (e.g. harry's lighthouse-prod committed). Rebase our README change
      # onto the latest main so the auto-commit push is fast-forward.
      - name: Rebase README change onto latest main
        run: |
          cp apps/emilychang-me/README.md /tmp/README.lh-emily.md
          cp .github/lighthouse-data/emily-prod.json /tmp/emily-prod.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/README.lh-emily.md apps/emilychang-me/README.md
          mkdir -p .github/lighthouse-data
          cp /tmp/emily-prod.json .github/lighthouse-data/emily-prod.json

      - name: Commit production Lighthouse changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): daily emily lighthouse audit — update README scores [skip ci]"
          file_pattern: "apps/emilychang-me/README.md .github/lighthouse-data/emily-prod.json"
          branch: main
