name: Lighthouse Audit (synthetic)

on:
  push:
    paths:
      - "apps/harrychang-me/**"
      - "packages/**"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI (synthetic, harry localhost build)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_MAIN_URL: "http://localhost:3000"
      # Prisma generate only reads the schema — any valid URL format works here
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/portfolio"
      # Font download is skipped gracefully when FONT_DRIVE_ID is absent
      # Spotify / Resend stubs prevent build errors for unused runtime env vars
      SPOTIFY_CLIENT_ID: stub
      SPOTIFY_CLIENT_SECRET: stub
      SPOTIFY_REFRESH_TOKEN: stub
      RESEND_API_KEY: stub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create stub font files (private fonts not available in CI)
        run: |
          mkdir -p apps/harrychang-me/public/fonts/artific-fonts
          for weight in Thin SuperLight Light Regular Medium SemiBold Bold SuperBold Black; do
            touch "apps/harrychang-me/public/fonts/artific-fonts/Artific-${weight}.woff2"
          done

      - name: Build harrychang-me (CI build — skips DB migration)
        run: pnpm --filter harry-chang-portfolio build:ci

      - name: Start production server
        run: pnpm --filter harry-chang-portfolio start &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI (Mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/blog
            http://localhost:3000/projects
            http://localhost:3000/gallery
            http://localhost:3000/uses
            http://localhost:3000/cv
            http://localhost:3000/linktree
            http://localhost:3000/design
            http://localhost:3000/paper-reading
            http://localhost:3000/manifesto
            http://localhost:3000/projects/2025_04_12_portfolio
            http://localhost:3000/projects/2024_09_23_chingshin_rag
            http://localhost:3000/projects/2025_03_08_sitcon_keynote
            http://localhost:3000/projects/2025_08_04_debate
            http://localhost:3000/projects/2024_08_19_classics_reimagined
            http://localhost:3000/gallery/2026_02_08_italy_mountain
            http://localhost:3000/gallery/2023_07_07_splash_of_red
            http://localhost:3000/gallery/2023_10_06_against_giants
            http://localhost:3000/gallery/2023_11_18_dusk_impressions
            http://localhost:3000/gallery/2024_01_06_hehuanshan
            http://localhost:3000/blog/9_m11d
            http://localhost:3000/blog/2025_12_19_xpro1
            http://localhost:3000/blog/2025_12_22_aftersun_paris_texas
            http://localhost:3000/blog/2026_01_10_plushies
            http://localhost:3000/blog/2026_02_10_synecdoche_truman
            http://localhost:3000/graph
          configPath: apps/harrychang-me/.lighthouserc.mobile.json
          artifactName: lighthouse-results-mobile
          uploadArtifacts: true
          temporaryPublicStorage: true

      # lhci writes LHRs to .lighthouseci/ and treosh/lighthouse-ci-action@v12
      # has no input for redirecting that — only artifactName (upload) is in
      # the action's schema. Move them so the desktop run below doesn't
      # clobber the mobile JSONs and the README script can read them from
      # .lighthouseci-mobile/.
      - name: Move mobile LHRs out of .lighthouseci
        run: |
          if [ -d .lighthouseci ]; then
            rm -rf .lighthouseci-mobile
            mv .lighthouseci .lighthouseci-mobile
          fi

      - name: Run Lighthouse CI (Desktop)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/blog
            http://localhost:3000/projects
            http://localhost:3000/gallery
            http://localhost:3000/uses
            http://localhost:3000/cv
            http://localhost:3000/linktree
            http://localhost:3000/design
            http://localhost:3000/paper-reading
            http://localhost:3000/manifesto
            http://localhost:3000/projects/2025_04_12_portfolio
            http://localhost:3000/projects/2024_09_23_chingshin_rag
            http://localhost:3000/projects/2025_03_08_sitcon_keynote
            http://localhost:3000/projects/2025_08_04_debate
            http://localhost:3000/projects/2024_08_19_classics_reimagined
            http://localhost:3000/gallery/2026_02_08_italy_mountain
            http://localhost:3000/gallery/2023_07_07_splash_of_red
            http://localhost:3000/gallery/2023_10_06_against_giants
            http://localhost:3000/gallery/2023_11_18_dusk_impressions
            http://localhost:3000/gallery/2024_01_06_hehuanshan
            http://localhost:3000/blog/9_m11d
            http://localhost:3000/blog/2025_12_19_xpro1
            http://localhost:3000/blog/2025_12_22_aftersun_paris_texas
            http://localhost:3000/blog/2026_01_10_plushies
            http://localhost:3000/blog/2026_02_10_synecdoche_truman
            http://localhost:3000/graph
          configPath: apps/harrychang-me/.lighthouserc.json
          artifactName: lighthouse-results-desktop
          uploadArtifacts: true
          temporaryPublicStorage: true

      # README commit is only meaningful on main. On PR branches we still run
      # lighthouse for visibility, but skip writing — the rebase-onto-main
      # trick rewrites local history and would cause a non-fast-forward push.
      - name: Update README with Lighthouse Badges
        if: github.ref == 'refs/heads/main'
        run: node .github/scripts/update-lighthouse-readme.js

      - name: Format README with Prettier
        if: github.ref == 'refs/heads/main'
        run: npx prettier --write apps/harrychang-me/README.md

      # Lighthouse runs are long (~30+ min). Main may have moved during that
      # window (e.g. lighthouse-prod committed). Rebase our README change onto
      # the latest main so the auto-commit push is fast-forward.
      - name: Rebase README change onto latest main
        if: github.ref == 'refs/heads/main'
        run: |
          cp apps/harrychang-me/README.md /tmp/README.lh.md
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/README.lh.md apps/harrychang-me/README.md

      - name: Commit Lighthouse Changes
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update lighthouse scores in README [skip ci]"
          file_pattern: "apps/harrychang-me/README.md"
          branch: main