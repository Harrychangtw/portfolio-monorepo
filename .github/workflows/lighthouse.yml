name: Lighthouse Audit

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/harrychang-me/**"
      - "packages/**"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/harrychang-me/**"
      - "packages/**"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_MAIN_URL: "http://localhost:3000"
      # Prisma generate only reads the schema — any valid URL format works here
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/portfolio"
      # Font download is skipped gracefully when FONT_DRIVE_ID is absent
      # Spotify / Resend stubs prevent build errors for unused runtime env vars
      SPOTIFY_CLIENT_ID: stub
      SPOTIFY_CLIENT_SECRET: stub
      SPOTIFY_REFRESH_TOKEN: stub
      RESEND_API_KEY: stub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create stub font files (private fonts not available in CI)
        run: |
          mkdir -p apps/harrychang-me/public/fonts/artific-fonts
          for weight in Thin SuperLight Light Regular Medium SemiBold Bold SuperBold Black; do
            touch "apps/harrychang-me/public/fonts/artific-fonts/Artific-${weight}.woff2"
          done

      - name: Build harrychang-me (CI build — skips DB migration)
        run: pnpm --filter harry-chang-portfolio build:ci

      - name: Start production server
        run: pnpm --filter harry-chang-portfolio start &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/blog
            http://localhost:3000/projects
            http://localhost:3000/gallery
            http://localhost:3000/uses
            http://localhost:3000/cv
            http://localhost:3000/linktree
          configPath: apps/harrychang-me/.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Update README with Lighthouse Badges
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          
          const manifestPath = path.join('.lighthouseci', 'manifest.json');
          if (!fs.existsSync(manifestPath)) {
            console.log('No Lighthouse manifest found. Skipping README update.');
            process.exit(0);
          }
          
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const scores = {};
          
          manifest.forEach(run => {
            const urlPath = new URL(run.url).pathname || '/';
            const score = Math.round(run.summary.performance * 100);
            if (!scores[urlPath] || score > scores[urlPath]) {
              scores[urlPath] = score;
            }
          });
          
          let markdown = '<!-- LIGHTHOUSE_RESULTS_START -->\n';
          markdown += '| Tested Route | Performance Score |\n';
          markdown += '|:---|:---|\n';
          
          Object.keys(scores).sort().forEach(route => {
            const score = scores[route];
            const color = score >= 90 ? 'success' : score >= 50 ? 'important' : 'critical';
            markdown += \`| \\\`\${route}\\\` | ![Lighthouse Score \${score}](https://img.shields.io/badge/\${score}-\${color}?style=flat-square&logo=lighthouse) |\n\`;
          });
          
          markdown += '<!-- LIGHTHOUSE_RESULTS_END -->';
          
          const readmePath = path.join('apps', 'harrychang-me', 'README.md');
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(/<!-- LIGHTHOUSE_RESULTS_START -->[\s\S]*<!-- LIGHTHOUSE_RESULTS_END -->/, markdown);
          fs.writeFileSync(readmePath, readme);
          "

      - name: Commit Lighthouse Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update lighthouse scores in README [skip ci]"
          file_pattern: "apps/harrychang-me/README.md"