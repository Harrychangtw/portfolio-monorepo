name: Image Refs

on:
  push:
    paths:
      - "apps/harrychang-me/content/**"
      - "apps/harrychang-me/public/images/**"
      - "apps/harrychang-me/scripts/check-image-refs.mjs"
      - ".github/workflows/image-refs.yml"
  pull_request:
    paths:
      - "apps/harrychang-me/content/**"
      - "apps/harrychang-me/public/images/**"
      - "apps/harrychang-me/scripts/check-image-refs.mjs"
      - ".github/workflows/image-refs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Case-exact image ref check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check image refs
        working-directory: apps/harrychang-me
        run: node scripts/check-image-refs.mjs
