<div class="cols">
<div>
<h3 id="%E4%B8%8A%E4%B8%80%E5%A0%82">上一堂</h3>
<p>餵進去的是一排數字。</p>
<p><code>[5.1, 3.5, 1.4, 0.2]</code></p>
<p><em>花瓣長度、寬度，本來就是數字。</em></p>

<div data-marpit-fragment="1">
<h3 id="%E9%80%99%E5%A0%82">這堂</h3>
<p>餵進去的是<strong>一句話</strong>。</p>
<p>「今天天氣真好」</p>
<p><em>模型看不懂字，得先把字變成數字。</em></p>
</div>
</div>
<div data-marpit-fragment="2">
<p>差的那一步，就是<strong>把文字變成數字</strong>。</p>
</div>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="7" data-paginate="true" data-footer="文字怎麼變數字" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="7" style="--paginate:true;--footer:文字怎麼變數字;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E7%AC%AC%E4%B8%80%E6%AD%A5%E5%85%88%E5%88%87%E6%88%90%E5%B0%8F%E5%A1%8A-%E7%82%BA%E4%BB%80%E9%BA%BC%E8%A6%81%E5%85%88%E5%88%87%E5%A1%8A">第一步：先切成小塊 <em>為什麼要先切塊?</em></h1>
<p>句子有無限多種，沒辦法一句一句對應到數字。</p>
<div data-marpit-fragment="1">
<p>先把句子<strong>切成一小塊一小塊</strong>，這些小塊就叫 token。</p>
</div>
<div data-marpit-fragment="2">
<p><em>塊的種類是有限的，每一塊才能在詞表裡有自己的編號。</em></p>
<p><em>負責切塊的工具，就叫 tokenizer，下一站就去玩它。</em></p>
</div>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="8" data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="8" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%8F%9B%E4%BD%A0%E5%8B%95%E6%89%8B-tokenizer-%E6%8E%A2%E7%B4%A2%E7%AB%99">換你動手 <em>Tokenizer 探索站</em></h1>
<div class="station">
<div class="st">
<h4>你要動的旋鈕</h4>
<p>輸入任意文字，切換<strong>切分方式</strong>（字元／詞／BPE），看同一句話切出不同的 <strong>token</strong> 與編號</p>
</div>
<div class="st">
<h4>試試看</h4>
<ul>
<li>中英混寫「機器學習的 tokenization」，字元／詞／BPE 各按一次</li>
<li>標點與空格「你好！！！」，看空格怎麼被標記</li>
<li>罕見詞、自己的名字「祺煒」，在字元／詞模式看會不會變成 [UNK]（沒看過的詞）</li>
</ul>
</div>
<div class="st">
<h4>你應該會看到</h4>
<p>換一種切法，同一句話就變成不同數量、不同邊界的 token。</p>
</div>
<div class="st check">
<h4>檢核點</h4>
<p>我按過三種切法，看到同一句話的 token 數和切分邊界都不一樣。</p>
</div>
</div>
<p><span class="chip">🛠 講師畫面／各組電腦已開好 · <a href="https://camp.harrychang.me/tokenizer">/tokenizer</a></span></p>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="9" data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="9" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%A8%A1%E5%9E%8B%E7%9C%BC%E4%B8%AD%E5%8F%AA%E6%9C%89-token-%E5%92%8C%E7%B7%A8%E8%99%9F">模型眼中，只有 Token 和編號</h1>
<div class="cols">
<div>
<h3 id="text-%E8%A6%96%E8%A7%92">Text 視角</h3>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/oai-tokenizer-text-token.png" alt="" style="height:820px;" /></p>
<h6 id="%E5%BD%A9%E8%89%B2%E5%88%87%E5%A1%8A%E4%B8%80%E5%8F%A5%E8%A9%B1%E8%A2%AB%E5%88%87%E6%88%90%E4%B8%80%E9%A1%86%E9%A1%86-token">彩色切塊：一句話被切成一顆顆 token</h6>
</div>
<div>
<h3 id="token-ids-%E8%A6%96%E8%A7%92">Token IDs 視角</h3>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/oai-tokenizer-token-id.png" alt="" style="height:820px;" /></p>
<h6 id="%E6%AF%8F%E9%A1%86-token-%E4%B8%80%E5%80%8B%E7%B7%A8%E8%99%9F%E6%98%AF%E5%BA%A7%E8%99%9F%E4%B8%8D%E6%98%AF%E8%AA%9E%E6%84%8F">每顆 token 一個編號，是座號不是語意</h6>
</div>
</div>
<p>所以在模型眼中，只有 <strong>token</strong> 和它的編號。</p>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="10" data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="10" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E7%B4%B0%E8%88%87%E5%A4%9A%E7%9A%84%E6%8A%98%E8%A1%B7-%E7%82%BA%E4%BB%80%E9%BA%BC%E5%88%87%E6%88%90%E9%80%99%E6%A8%A3">細與多的折衷 <em>為什麼切成這樣?</em></h1>
<div class="caps">
<div class="cap" data-marpit-fragment="1">
<span class="cap-emoji">🔡</span>
<div class="cap-label"><span class="cap-title">照字母切</span><span class="cap-sub">Character-level</span></div>
<div class="cap-div"></div>
<div class="cap-text">'hello' → ['h', 'e', 'l', 'l', 'o']，切最細，一句話變超長。</div>
</div>
<div class="cap" data-marpit-fragment="2">
<span class="cap-emoji">📚</span>
<div class="cap-label"><span class="cap-title">照整詞切</span><span class="cap-sub">Word-level</span></div>
<div class="cap-div"></div>
<div class="cap-text">'祺煒' → [UNK]，詞表爆炸，還老是遇到新詞。</div>
</div>
<div class="cap" data-marpit-fragment="3">
<span class="cap-emoji">✂️</span>
<div class="cap-label"><span class="cap-title">照字塊切</span><span class="cap-sub">Subword</span></div>
<div class="cap-div"></div>
<div class="cap-text">'tokenizer' → ['token', 'izer']，長度與詞表兩邊都顧到。</div>
</div>
</div>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="11" data-paginate="true" data-footer="文字怎麼變數字" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="11" style="--paginate:true;--footer:文字怎麼變數字;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E7%B7%A8%E8%99%9F%E5%8F%AA%E6%98%AF%E5%BA%A7%E8%99%9F-%E5%85%89%E7%9C%8B%E8%99%9F%E7%A2%BC%E7%AD%94%E5%BE%97%E5%87%BA%E5%83%8F%E4%B8%8D%E5%83%8F%E5%97%8E">編號，只是座號 <em>光看號碼，答得出像不像嗎?</em></h1>
<p>「貓」是 3711 號、「狗」是 890 號、「桌子」是 12690 號。</p>
<p>只看號碼回答：<strong>哪兩個比較像?</strong></p>
<p><em>號碼只回答「是哪個字」，沒回答「跟哪些字像」。</em></p>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="12" data-paginate="true" data-footer="文字怎麼變數字" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="12" style="--paginate:true;--footer:文字怎麼變數字;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E9%96%8B%E9%96%80%E4%B9%8B%E5%89%8D%E5%85%88%E6%83%B3%E4%B8%80%E6%83%B3-%E4%B8%80%E5%BC%B5%E5%AD%97%E7%9A%84%E5%9C%B0%E5%9C%96">開門之前，先想一想 <em>一張字的地圖</em></h1>
<p>聽說有人把幾萬個字，搬進了同一張地圖，每個字有自己的位置。</p>
<div data-marpit-fragment="1">
<p><strong>照什麼規則排，這張地圖才有用?</strong></p>
</div>
<div data-marpit-fragment="2">
<p><em>想像一下：「貓」隔壁會住誰? 英文的 cat 會住哪裡? 「蘋果」的鄰居又是誰?</em></p>
</div>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="13" data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="13" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%8F%9B%E4%BD%A0%E5%8B%95%E6%89%8B-%E8%AA%9E%E6%84%8F%E5%9C%B0%E5%9C%96%E7%AB%99">換你動手 <em>語意地圖站</em></h1>
<div class="station">
<div class="st">
<h4>你要動的旋鈕</h4>
<p>打一個詞去搜，切平面／立體地圖（2D／3D），調 Top K 看誰住它隔壁</p>
</div>
<div class="st">
<h4>試試看</h4>
<ul>
<li>搜「貓」，把鄰居一個個唸出來，跟你剛剛的猜想對一對</li>
<li>找 cat：英文字自己住一區，還是就在「貓」隔壁?</li>
<li>搜「蘋果」：鄰居真的是水果嗎?</li>
</ul>
</div>
<div class="st">
<h4>你應該會看到</h4>
<p>有的字擠成一團、有的字離得老遠；擠在一起的字，意思好像都有關係。</p>
</div>
<div class="st check">
<h4>檢核點</h4>
<p>我驗完了自己的三個猜想，還能用一句話說出這張地圖排位置的規則。</p>
</div>
</div>
<p><span class="chip">🛠 講師畫面／各組電腦已開好 · <a href="https://camp.harrychang.me/embedding">/embedding</a></span></p>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="14" data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="14" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E4%BD%A0%E5%89%9B%E5%89%9B%E9%80%9B%E7%9A%84%E6%98%AF%E4%B8%80%E5%BC%B5%E5%AD%97%E7%9A%84%E5%9C%B0%E5%9C%96-%E9%80%99%E5%80%8B%E5%81%9A%E6%B3%95%E5%8F%AB-embedding">你剛剛逛的，是一張字的地圖 <em>這個做法，叫 embedding</em></h1>
<p>規則只有一條：<strong>意思像的字，住得近。</strong></p>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/word_embedding.png" alt="" style="height:820px;" /></p>
<h6 id="%E6%AF%8F%E5%80%8B%E5%AD%97%E7%9A%84%E4%BD%8D%E7%BD%AE%E5%85%B6%E5%AF%A6%E6%98%AF%E4%B8%80%E6%8E%92%E5%AD%B8%E5%87%BA%E4%BE%86%E7%9A%84%E6%95%B8%E5%AD%97%E5%83%8F%E9%96%80%E7%89%8C%E4%BD%8F%E5%9D%80%E5%85%89%E6%9C%89%E5%BA%A7%E8%99%9F%E5%81%9A%E4%B8%8D%E5%88%B0%E9%80%99%E4%BB%B6%E4%BA%8B">每個字的位置，其實是一排學出來的數字，像門牌住址；光有座號，做不到這件事</h6>
<p>把字變成住址的這個做法，就叫 <strong>embedding</strong>。</p>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="15" data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="15" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E9%80%99%E5%BC%B5%E5%9C%B0%E5%9C%96%E6%98%AF%E8%AA%B0%E6%8E%92%E7%9A%84-%E8%AA%9E%E6%84%8F%E6%98%AF%E6%80%8E%E9%BA%BC%E5%AD%B8%E5%87%BA%E4%BE%86%E7%9A%84">這張地圖，是誰排的? <em>語意是怎麼學出來的</em></h1>
<p>沒有人動手排。位置是模型在海量文字上玩「猜字遊戲」玩出來的。</p>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/word2vec_tasks.png" alt="" style="height:900px;" /></p>
<h6 id="%E5%9C%96%E5%90%8C%E4%B8%80%E5%8F%A5%E8%A9%B1%E7%9A%84%E5%85%A9%E7%A8%AE%E7%8E%A9%E6%B3%95%E4%B8%80%E7%A8%AE%E7%8C%9C%E8%A2%AB%E9%81%AE%E4%BD%8F%E7%9A%84%E5%AD%97%E4%B8%80%E7%A8%AE%E7%8C%9C%E6%97%81%E9%82%8A%E7%9A%84%E5%AD%97">圖：同一句話的兩種玩法，一種猜被遮住的字，一種猜旁邊的字</h6>
<p>能在同一種句子裡互換的字，遊戲玩久了，就會被<strong>搬到隔壁</strong>：貓和狗就是這樣變成鄰居的。</p>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="16" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;/slides/sitcon-camp-26-ml-course2/assets/bg/embedding-demo-composed.png&quot;);background-size:cover;"></figure></div></section></foreignObject><foreignObject width="3840" height="2160"><section id="16" data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="16" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="content">
<h1 id="%E9%80%A3%E6%80%8E%E9%BA%BC%E8%B5%B0%E9%83%BD%E6%9C%89%E6%84%8F%E7%BE%A9%E5%81%8F%E8%A6%8B%E4%B8%80%E8%B5%B7%E5%AD%B8%E9%80%B2%E4%BE%86">連「怎麼走」都有意義，偏見一起學進來</h1>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject><foreignObject width="3840" height="2160" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="16" style="" data-marpit-pagination-total="48" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="17" data-paginate="true" data-footer="文字怎麼變數字" data-theme="camp-dark" lang="C" data-marpit-pagination="17" style="--paginate:true;--footer:文字怎麼變數字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%96%87%E5%AD%97%E5%B0%B1%E9%80%99%E6%A8%A3%E8%AE%8A%E6%88%90%E6%95%B8%E5%AD%97-loop-0-%E5%B0%8F%E7%B5%90">文字，就這樣變成數字 <em>Loop 0 小結</em></h1>
<div class="caps">
<div class="cap" data-marpit-fragment="1">
<span class="cap-emoji">✂️</span>
<div class="cap-label"><span class="cap-title">切詞成塊</span></div>
<div class="cap-div"></div>
<div class="cap-text">一句話先切成一顆顆 token，才有能處理的單位。</div>
</div>
<div class="cap" data-marpit-fragment="2">
<span class="cap-emoji">🔢</span>
<div class="cap-label"><span class="cap-title">編號無意</span></div>
<div class="cap-div"></div>
<div class="cap-text">光給編號，查得到是哪個字，答不出誰跟誰像。</div>
</div>
<div class="cap" data-marpit-fragment="3">
<span class="cap-emoji">🗺️</span>
<div class="cap-label"><span class="cap-title w5">鄰居即語意</span></div>
<div class="cap-div"></div>
<div class="cap-text">embedding 給每個字一個住址，意思像的字住得近。</div>
</div>
<div class="cap" data-marpit-fragment="4">
<span class="cap-emoji">⚖️</span>
<div class="cap-label"><span class="cap-title">偏見殘留</span></div>
<div class="cap-div"></div>
<div class="cap-text">語料裡藏著的偏見，也會一起被學進字的位置裡。</div>
</div>
</div>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="18" data-paginate="true" data-footer="文字怎麼變數字" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="18" style="--paginate:true;--footer:文字怎麼變數字;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E7%8F%BE%E5%9C%A8%E6%AF%8F%E5%80%8B%E5%AD%97%E9%83%BD%E6%98%AF%E4%B8%80%E6%8E%92%E6%95%B8%E5%AD%97%E4%BA%86">現在，每個字都是一排數字了</h1>
<p>那……<strong>就能餵給上一堂的 MLP 了嗎?</strong></p>
<p><em>MLP：上一堂教的網路，一疊會學習的神經元，把一排數字變成答案</em></p>
<footer>文字怎麼變數字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section data-paginate="true" data-footer="MLP 吃文字" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="19" style="--paginate:true;--footer:MLP 吃文字;--class:divider;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;/slides/sitcon-camp-26-ml-course2/assets/bg/divider-02.png&quot;);background-size:cover;"></figure></div></section></foreignObject><foreignObject width="3840" height="2160"><section id="19" data-paginate="true" data-footer="MLP 吃文字" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="19" style="--paginate:true;--footer:MLP 吃文字;--class:divider;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="content"><footer>MLP 吃文字</footer>
</section>
</foreignObject><foreignObject width="3840" height="2160" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="MLP 吃文字" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="19" style="" data-marpit-pagination-total="48" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="20" data-paginate="true" data-footer="MLP 吃文字" data-theme="camp-dark" lang="C" data-marpit-pagination="20" style="--paginate:true;--footer:MLP 吃文字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%97%A9%E4%B8%8A%E9%82%A3%E9%A1%86-mlp%E7%9C%8B%E5%88%B0%E7%9A%84%E4%B8%8D%E6%98%AF%E5%9C%96-%E5%85%88%E5%9B%9E%E9%A0%AD%E7%9C%8B%E6%B8%85%E6%A5%9A%E5%AE%83%E6%8B%BF%E5%88%B0%E4%BB%80%E9%BA%BC">早上那顆 MLP，看到的不是「圖」 <em>先回頭看清楚它拿到什麼</em></h1>
<p>今天早上，你們親手訓練了一顆 MLP 認 CIFAR-10。</p>
<p>它拿到的不是圖：一張圖先<strong>攤平成 3,072 個數字</strong>，排成一排才餵進去。</p>
<p><em>文字也剛剛變成一排數字。先弄清楚：一排數字進去，MLP 到底「看」到什麼?</em></p>
<footer>MLP 吃文字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="21" data-paginate="true" data-footer="MLP 吃文字" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="21" style="--paginate:true;--footer:MLP 吃文字;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E5%85%88%E8%B7%9F%E4%BD%A0%E6%89%93%E5%80%8B%E8%B3%AD-%E6%8A%8A%E6%AF%8F%E4%B8%80%E9%A1%86%E5%83%8F%E7%B4%A0%E9%83%BD%E6%89%93%E4%BA%82">先跟你打個賭 <em>把每一顆像素都打亂</em></h1>
<p>把每張圖的 1,024 顆像素全部搬家，<strong>每張圖都照同一張搬家對照表</strong>，訓練和考試都是。</p>
<p>你，還認得嗎?</p>
<p>它，還學得會嗎?</p>
<footer>MLP 吃文字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="22" data-paginate="true" data-footer="MLP 吃文字" data-theme="camp-dark" lang="C" data-marpit-pagination="22" style="--paginate:true;--footer:MLP 吃文字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%8F%9B%E4%BD%A0%E5%8B%95%E6%89%8B-%E5%83%8F%E7%B4%A0%E6%92%9E%E7%89%86%E7%AB%99">換你動手 <em>像素撞牆站</em></h1>
<div class="station">
<div class="st">
<h4>你要動的旋鈕</h4>
<p>「▶ 訓練」讓兩顆一樣的 MLP 同時開練；「圖片 ‹ ›」換驗證圖；點神經元看它在找的圖案（權重樣板）；按「還原排列 π⁻¹」把像素搬回家</p>
</div>
<div class="st">
<h4>試試看</h4>
<ul>
<li>按「▶ 訓練」，盯著兩條 loss 曲線（錯誤分數，越低越好），等它自己跑完</li>
<li>用「圖片 ‹ ›」多換幾張，對照「你看到的」和「模型看到的」</li>
<li>按「⏸ 暫停」，點兩邊網路圖上同一顆隱藏神經元，再按「還原排列 π⁻¹」</li>
</ul>
</div>
<div class="st">
<h4>你應該會看到</h4>
<p>兩條 loss 曲線疊在一起，收在同一個準度，參考曲線終點 <strong>38% 對 38%</strong>；像素搬回家之後，打亂那顆神經元在找的圖案，跟原始那顆長得一樣。</p>
</div>
<div class="st check">
<h4>檢核點</h4>
<p>我看到打亂像素那顆 MLP，學得跟原始那顆一模一樣好。</p>
</div>
</div>
<p><span class="chip">🛠 講師畫面／各組電腦已開好 · <a href="https://camp.harrychang.me/pixel-shuffle">/pixel-shuffle</a></span></p>
<footer>MLP 吃文字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="23" data-paginate="true" data-footer="MLP 吃文字" data-theme="camp-dark" lang="C" data-marpit-pagination="23" style="--paginate:true;--footer:MLP 吃文字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E4%BD%A0%E7%9C%8B%E5%88%B0%E7%9A%84-vs-%E5%AE%83%E7%9C%8B%E5%88%B0%E7%9A%84-%E5%90%8C%E4%B8%80%E5%BC%B5%E5%9C%96">你看到的 vs. 它看到的 <em>同一張圖</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/pixel_shuffle_pair.png" alt="" style="height:1000px;" /></p>
<h6 id="%E5%9C%96%E7%AB%99%E4%B8%8A%E5%90%8C%E4%B8%80%E5%BC%B5%E9%A9%97%E8%AD%89%E5%9C%96%E8%B2%93%E5%8F%B3%E9%82%8A%E6%AF%8F%E9%A1%86%E5%83%8F%E7%B4%A0%E7%85%A7%E5%90%8C%E4%B8%80%E5%80%8B%E5%9B%BA%E5%AE%9A%E6%8E%92%E5%88%97-%CF%80-%E6%90%AC%E5%AE%B6%E6%95%B8%E5%80%BC%E4%B8%80%E5%80%8B%E9%83%BD%E6%B2%92%E8%AE%8A">圖：站上同一張驗證圖（貓），右邊每顆像素照同一個固定排列 π 搬家，數值一個都沒變</h6>
<p>對 MLP，位置只是<strong>編號</strong>；把編號換掉，題目沒變。</p>
<footer>MLP 吃文字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="24" data-paginate="true" data-footer="MLP 吃文字" data-theme="camp-dark" lang="C" data-marpit-pagination="24" style="--paginate:true;--footer:MLP 吃文字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%95%85%E4%BA%8B-vs-%E4%BA%8B%E6%95%85-%E6%8F%9B%E5%88%B0%E6%96%87%E5%AD%97%E5%90%8C%E4%B8%80%E9%81%93%E7%89%86">故事 vs. 事故 <em>換到文字，同一道牆</em></h1>
<p>圖的排列、句子的詞序，對這種模型都只是編號。</p>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/story_accident_bag.png" alt="" style="height:900px;" /></p>
<h6 id="%E5%9C%96%F0%9F%93%96-%E6%95%85%E4%BA%8B-%E8%88%87-%F0%9F%92%A5-%E4%BA%8B%E6%95%85-%E6%98%AF%E5%90%8C%E4%B8%80%E8%A2%8B%E6%95%85%EF%BC%8B%E4%BA%8B%E9%A0%86%E5%BA%8F%E5%B0%8D%E8%AA%BF%E4%B8%80%E8%A2%8B%E5%AD%97%E7%9A%84%E6%A8%A1%E5%9E%8B%E8%BC%B8%E5%87%BA%E5%AE%8C%E5%85%A8%E7%9B%B8%E5%90%8C">圖：<img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> 故事 與 <img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 事故 是同一袋「故」＋「事」，順序對調，一袋字的模型輸出完全相同</h6>
<p>語意天差地遠，它卻 <strong>分不出來</strong>。</p>
<footer>MLP 吃文字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="25" data-paginate="true" data-footer="MLP 吃文字" data-theme="camp-dark" lang="C" data-marpit-pagination="25" style="--paginate:true;--footer:MLP 吃文字;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E5%95%8F%E9%A1%8C%E4%B8%8D%E5%9C%A8%E6%BA%96%E5%BA%A6%E5%9C%A8%E5%81%87%E8%A8%AD">問題不在準度，在假設</h1>
<p>準度一分都沒掉：MLP 的設計裡，根本沒有「排列有意義」這個假設。</p>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/bag_vs_seq.png" alt="" style="height:460px;" /></p>
<h6 id="%E5%9C%96%E8%A9%9E%E8%A2%8B%E6%8A%8A%E5%AD%97%E4%B8%9F%E6%88%90%E4%B8%80%E5%A0%86%E7%84%A1%E5%BA%8F-%E5%BA%8F%E5%88%97%E8%AE%93%E5%AD%97%E4%B8%80%E5%80%8B%E6%8E%A5%E4%B8%80%E5%80%8B%E6%9C%89%E5%BA%8F">圖：詞袋把字丟成一堆（無序）· 序列讓字一個接一個（有序）</h6>
<p>我們需要一個 <strong>假設順序有意義</strong> 的架構 → RNN。</p>
<p><em>RNN：一次讀一個字、把記憶往後傳的網路，下一節的主角</em></p>
<footer>MLP 吃文字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="26" data-paginate="true" data-footer="MLP 吃文字" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="26" style="--paginate:true;--footer:MLP 吃文字;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E4%BC%91%E6%81%AF-10-%E5%88%86%E9%90%98-%E5%96%9D%E5%8F%A3%E6%B0%B4%E7%AD%89%E7%AD%89%E5%9B%9E%E4%BE%86%E6%8B%86%E7%89%86">休息 10 分鐘 <em>喝口水，等等回來拆牆</em></h1>
<p>10 分鐘後回來，準時開始 RNN。</p>
<p><em>實際回來時間由講師現場宣布。</em></p>
<footer>MLP 吃文字</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section data-paginate="true" data-footer="RNN" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="27" style="--paginate:true;--footer:RNN;--class:divider;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;/slides/sitcon-camp-26-ml-course2/assets/bg/divider-03.png&quot;);background-size:cover;"></figure></div></section></foreignObject><foreignObject width="3840" height="2160"><section id="27" data-paginate="true" data-footer="RNN" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="27" style="--paginate:true;--footer:RNN;--class:divider;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="content"><footer>RNN</footer>
</section>
</foreignObject><foreignObject width="3840" height="2160" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="RNN" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="27" style="" data-marpit-pagination-total="48" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="28" data-paginate="true" data-footer="RNN" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="28" style="--paginate:true;--footer:RNN;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E5%85%88%E7%8E%A9%E5%80%8B%E9%81%8A%E6%88%B2-%E7%8C%9C%E4%B8%8B%E4%B8%80%E5%80%8B%E5%AD%97">先玩個遊戲 <em>猜下一個字</em></h1>
<h2 id="%E4%BB%8A%E5%A4%A9%E5%A4%A9%E6%B0%A3%E7%9C%9F-%EF%BC%BF%EF%BC%BF">今天天氣真 <strong>＿＿</strong></h2>
<div data-marpit-fragment="1">
<p><em>你腦中大概已經有答案了，可能是：</em> 好／熱／冷</p>
</div>
<div data-marpit-fragment="2">
<h2 id="%E4%BB%8A%E5%A4%A9%E6%98%AF%E5%A4%8F%E5%A4%A9%E6%BA%AB%E5%BA%A6-40-%E5%BA%A6%E4%BB%8A%E5%A4%A9%E5%A4%A9%E6%B0%A3%E7%9C%9F-%EF%BC%BF%EF%BC%BF">今天是夏天，溫度 40 度，今天天氣真 <strong>＿＿</strong></h2>
</div>
<div data-marpit-fragment="3">
<p><em>前文一多，答案立刻收斂：</em> 熱</p>
</div>
<footer>RNN</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="29" data-paginate="true" data-footer="RNN" data-theme="camp-dark" lang="C" data-marpit-pagination="29" style="--paginate:true;--footer:RNN;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%8F%9B%E4%BD%A0%E5%8B%95%E6%89%8B-next-token-%E7%AB%99">換你動手 <em>next-token 站</em></h1>
<div class="station">
<div class="st">
<h4>你要動的旋鈕</h4>
<p>前文視窗（context）大小：模型能看到最後幾個 token；Temperature／Top-k 是進階旋鈕，好奇再玩</p>
</div>
<div class="st">
<h4>試試看</h4>
<ul>
<li>點預設句「今天天氣真」，看 Qwen3 列出的候選字；再點 40 度的加長版，看「熱」怎麼衝上第一</li>
<li>把前文視窗縮到只剩 1~2 個 token，再放寬，看候選字怎麼變</li>
<li>找一句「視窗小會押錯、放寬就押對」的話</li>
</ul>
</div>
<div class="st">
<h4>你應該會看到</h4>
<p>前文看得越多，押得<strong>越有把握</strong>：第一名的把握變大，其他選項縮小。</p>
</div>
<div class="st check">
<h4>檢核點</h4>
<p>我看到前文視窗放寬後，模型把把握集中到更少的字上。</p>
</div>
</div>
<p><span class="chip">🛠 講師畫面／各組電腦已開好 · <a href="https://camp.harrychang.me/next-token">/next-token</a></span></p>
<footer>RNN</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="30" data-paginate="true" data-footer="RNN" data-theme="camp-dark" lang="C" data-marpit-pagination="30" style="--paginate:true;--footer:RNN;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E7%9C%8B%E5%BE%97%E8%B6%8A%E5%A4%9A%E8%B6%8A%E6%9C%89%E6%8A%8A%E6%8F%A1-%E5%8F%AF%E6%98%AF%E5%8F%A5%E5%AD%90%E6%9C%83%E4%B8%80%E7%9B%B4%E8%AE%8A%E9%95%B7">看得越多，越有把握 <em>可是句子會一直變長</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/context_accuracy.png" alt="" style="height:1000px;" /></p>
<h6 id="%E5%9C%96%E8%83%BD%E7%9C%8B%E5%88%B0%E7%9A%84%E5%89%8D%E6%96%87%E8%B6%8A%E9%95%B7%E4%B8%8B%E4%B8%80%E5%80%8B%E5%AD%97%E6%8A%BC%E5%BE%97%E8%B6%8A%E6%9C%89%E6%8A%8A%E6%8F%A1%E7%A4%BA%E6%84%8F%E5%9C%96">圖：能看到的前文越長，下一個字押得越有把握（示意圖）</h6>
<p>猜下一個字靠前文，可是句子會一直變長，得把前面 <strong>記住</strong> 、一路帶著走。</p>
<footer>RNN</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="31" data-paginate="true" data-footer="RNN" data-theme="camp-dark" lang="C" data-marpit-pagination="31" style="--paginate:true;--footer:RNN;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="rnn-%E4%B8%80%E6%AC%A1%E5%90%83%E4%B8%80%E5%80%8B%E5%AD%97%E6%8A%8A%E8%A8%98%E6%86%B6%E5%BE%80%E5%BE%8C%E5%82%B3">RNN <em>一次吃一個字，把記憶往後傳</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/rnn_flow.png" alt="" style="height:960px;" /></p>
<h6 id="%E5%9C%96%E6%AF%8F%E8%AE%80%E4%B8%80%E5%80%8B%E5%AD%97%E6%9B%B4%E6%96%B0%E8%A8%98%E6%86%B6%E5%86%8D%E5%82%B3%E4%B8%8B%E5%8E%BB%E7%AC%AC%E4%B8%80%E5%80%8B%E5%AD%97%E7%9A%84%E8%B3%87%E8%A8%8A%E6%9C%83%E6%B2%BF%E9%80%94%E8%AE%8A%E6%B7%A1">圖：每讀一個字，更新記憶再傳下去；第一個字的資訊會沿途變淡</h6>
<p>每讀一個字，就<strong>更新一次記憶</strong>，再把記憶傳給下一個字。</p>
<footer>RNN</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="32" data-paginate="true" data-footer="RNN" data-theme="camp-dark" lang="C" data-marpit-pagination="32" style="--paginate:true;--footer:RNN;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E8%AE%80%E4%B8%80%E5%80%8B%E5%AD%97%E6%9B%B4%E6%96%B0%E8%A8%98%E6%86%B6%E5%82%B3%E4%B8%8B%E5%8E%BB-%E5%90%8C%E4%B8%80%E5%80%8B%E7%B6%B2%E8%B7%AF%E9%87%8D%E8%A4%87%E7%94%A8%E5%9B%9B%E6%AC%A1">讀一個字，更新記憶，傳下去 <em>同一個網路，重複用四次</em></h1>
<div style="position:relative; height:900px;">
<div style="position:absolute; left:0; right:0; top:0;">
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/rnn_step_1.png" alt="" style="height:900px;" /></p>
</div>
<div data-marpit-fragment="1" style="position:absolute; left:0; right:0; top:0;">
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/rnn_step_2.png" alt="" style="height:900px;" /></p>
</div>
<div data-marpit-fragment="2" style="position:absolute; left:0; right:0; top:0;">
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/rnn_step_3.png" alt="" style="height:900px;" /></p>
</div>
<div data-marpit-fragment="3" style="position:absolute; left:0; right:0; top:0;">
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/rnn_step_4.png" alt="" style="height:900px;" /></p>
</div>
</div>
<h6 id="%E5%9C%96%E4%BB%8A%E5%A4%A9%E5%A4%A9%E6%B0%A3%E7%9C%9F%E5%A5%BD%E5%88%87%E6%88%90%E5%9B%9B%E9%A1%86-token%E4%B8%80%E6%AD%A5%E5%90%83%E4%B8%80%E9%A1%86%E8%A8%98%E6%86%B6%E7%9B%92%E6%AF%8F%E4%B8%80%E6%AD%A5%E9%83%BD%E4%B8%80%E6%A8%A3%E5%A4%A7">圖：「今天天氣真好」切成四顆 token，一步吃一顆；記憶盒每一步都一樣大</h6>
<p>上一步傳出來的記憶，<strong>就是下一步的輸入</strong>。</p>
<footer>RNN</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="33" data-paginate="true" data-footer="RNN" data-theme="camp-dark" lang="C" data-marpit-pagination="33" style="--paginate:true;--footer:RNN;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%8F%9B%E4%BD%A0%E5%8B%95%E6%89%8B-rnn-%E8%A6%96%E8%A6%BA%E5%8C%96%E7%AB%99">換你動手 <em>RNN 視覺化站</em></h1>
<div class="station">
<div class="st">
<h4>你要動的旋鈕</h4>
<p>拖曳滑桿逐 token 前進，看記憶（hidden state）一列列填進格子圖；也可自己打一句丟給 GPU 上的 RNN</p>
</div>
<div class="st">
<h4>試試看</h4>
<ul>
<li>點預設句：短句「the cat sat」、長句「the cat sat by the door…」各跑一次</li>
<li>盯住底下那條「影響」列，第一個字到句尾還剩多少</li>
<li>拖到句尾，看最早的 token 怎麼被逐漸沖淡</li>
</ul>
</div>
<div class="st">
<h4>你應該會看到</h4>
<p>記憶（hidden state）一格格往後填；句子一長，最早那個 token 在「影響」列幾乎<strong>歸零</strong>。</p>
</div>
<div class="st check">
<h4>檢核點</h4>
<p>我看到長句跑到句尾時，第一個字的資訊幾乎不見了。</p>
</div>
</div>
<p><span class="chip">🛠 講師畫面／各組電腦已開好 · <a href="https://camp.harrychang.me/rnn-viz">/rnn-viz</a></span></p>
<footer>RNN</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="34" data-paginate="true" data-footer="RNN" data-theme="camp-dark" lang="C" data-marpit-pagination="34" style="--paginate:true;--footer:RNN;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="rnn-%E6%92%9E%E5%88%B0%E7%9A%84%E5%85%A9%E9%81%93%E7%89%86-%E6%89%80%E4%BB%A5%E9%82%84%E9%9C%80%E8%A6%81%E4%B8%8B%E4%B8%80%E5%80%8B%E6%9E%B6%E6%A7%8B">RNN 撞到的兩道牆 <em>所以還需要下一個架構</em></h1>
<div class="cols">
<div>
<h3 id="%F0%9F%A7%A0-%E8%A8%98%E6%86%B6%E5%81%A5%E5%BF%98"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> 記憶健忘</h3>
<p><em>越長越記不住</em></p>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/rnn_wall_forget.png" alt="" style="height:460px;" /></p>
<p>句子一長，前面的資訊被沖淡，長句記不住開頭。</p>
</div>
<div>
<h3 id="%E2%9A%A1-%E8%A8%93%E7%B7%B4%E4%B8%8D%E7%A9%A9"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 訓練不穩</h3>
<p><em>越練越亂跳</em></p>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/rnn_wall_unstable.png" alt="" style="height:460px;" /></p>
<p>訓練時的糾正得從句尾一站一站傳回句首，站一多，不是越傳越走樣，就是傳到沒聲音。</p>
</div>
</div>
<p>記憶得一站一站傳，那能不能讓每個字 <strong>直接互看</strong> ?</p>
<footer>RNN</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section data-paginate="true" data-footer="Transformer" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="35" style="--paginate:true;--footer:Transformer;--class:divider;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;/slides/sitcon-camp-26-ml-course2/assets/bg/divider-04.png&quot;);background-size:cover;"></figure></div></section></foreignObject><foreignObject width="3840" height="2160"><section id="35" data-paginate="true" data-footer="Transformer" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="35" style="--paginate:true;--footer:Transformer;--class:divider;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="content"><footer>Transformer</footer>
</section>
</foreignObject><foreignObject width="3840" height="2160" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Transformer" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="35" style="" data-marpit-pagination-total="48" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="36" data-paginate="true" data-footer="Transformer" data-theme="camp-dark" lang="C" data-marpit-pagination="36" style="--paginate:true;--footer:Transformer;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%8F%9B%E5%80%8B%E6%83%B3%E6%B3%95-%E4%B8%8D%E7%94%A8%E4%B8%80%E7%AB%99%E4%B8%80%E7%AB%99%E5%82%B3">換個想法 <em>不用一站一站傳</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/rnn_vs_attention.png" alt="" style="height:1040px;" /></p>
<h6 id="%E5%B7%A6rnn-%E8%A8%98%E6%86%B6%E4%B8%80%E7%AB%99%E4%B8%80%E7%AB%99%E5%82%B3%E8%B6%8A%E5%82%B3%E8%B6%8A%E6%B7%A1%E5%8F%B3%E6%AF%8F%E5%80%8B%E5%AD%97%E7%9B%B4%E6%8E%A5%E9%80%A3%E5%88%B0%E6%89%80%E6%9C%89%E5%AD%97">左：RNN 記憶一站一站傳，越傳越淡；右：每個字直接連到所有字</h6>
<p>與其接力傳記憶，不如讓每個字直接看所有字，這就是 <strong>attention</strong>（注意力）。</p>
<p><em>用這一招疊出來的新架構，名字就叫 Transformer。</em></p>
<footer>Transformer</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="37" data-paginate="true" data-footer="Transformer" data-theme="camp-dark" lang="C" data-marpit-pagination="37" style="--paginate:true;--footer:Transformer;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%8F%9B%E4%BD%A0%E5%8B%95%E6%89%8B-transformer-%E7%AB%99%E3%83%BBattention-%E9%80%A3%E7%B7%9A">換你動手 <em>Transformer 站・attention 連線</em></h1>
<div class="station">
<div class="st">
<h4>你要動的旋鈕</h4>
<p>滑過<strong>注意力格子圖</strong>，看某個字把多少注意力分給另一個字；再動 Layer（第幾層）× Head（哪一種眼光）換層換頭。</p>
</div>
<div class="st">
<h4>試試看</h4>
<ul>
<li>點預設句「我的媽媽說她很開心」，滑到「她」，亮起來的格子就是它在看誰</li>
<li>自己打一句有指代的句子，讓 GPU 跑一次真實 pipeline，再看一次</li>
<li>轉 Layer／Head，看不同層、不同頭的關注模式怎麼變</li>
</ul>
</div>
<div class="st">
<h4>你應該會看到</h4>
<p>每個字直接對整句算注意力，但只看得到自己左邊（右邊還沒出生），相關的字一格就連上，沒有逐站接力。</p>
</div>
<div class="st check">
<h4>檢核點</h4>
<p>我滑到一格，就看到某個字把注意力直接分給了相關的字。</p>
</div>
</div>
<p><span class="chip">🛠 講師畫面／各組電腦已開好 · <a href="https://camp.harrychang.me/transformer">/transformer</a></span></p>
<footer>Transformer</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="38" data-paginate="true" data-footer="Transformer" data-theme="camp-dark" lang="C" data-marpit-pagination="38" style="--paginate:true;--footer:Transformer;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E5%89%9B%E5%89%9B%E5%8B%95%E7%9A%84-head%E5%88%B0%E5%BA%95%E6%98%AF%E4%BB%80%E9%BA%BC-%E5%A4%9A%E9%A0%AD%E6%B3%A8%E6%84%8F%E5%8A%9B-multi-head">剛剛動的 Head，到底是什麼? <em>多頭注意力 Multi-head</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/multihead_heads.png" alt="" style="height:740px;" /></p>
<h6 id="%E5%9C%96%E5%B8%B8%E8%A6%8B%E7%9A%84%E9%A0%AD%E5%A4%A7%E6%A6%82%E9%95%B7%E9%80%99%E5%B9%BE%E7%A8%AE%E6%A8%A3%E5%AD%90%E7%9C%9F%E5%AF%A6%E7%9A%84%E9%A0%AD%E6%9B%B4%E4%BA%82%E6%89%BE%E4%B8%8D%E5%88%B0%E5%80%8B%E6%80%A7%E4%B9%9F%E6%AD%A3%E5%B8%B8">圖：常見的頭大概長這幾種樣子；真實的頭更亂，找不到個性也正常</h6>
<p>一個頭一次只能用一種眼光看「誰看誰」，所以 Transformer 開<strong>好幾個頭，各看各的</strong>，最後再合起來；這件事還疊了很多層，每層都有自己的一組頭。</p>
<p>回站上獵頭：動 Layer × Head，找一個個性最明顯的頭，跟隔壁比誰找到的頭最有戲。</p>
<footer>Transformer</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="39" data-paginate="true" data-footer="Transformer" data-theme="camp-dark" lang="C" data-marpit-pagination="39" style="--paginate:true;--footer:Transformer;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E6%8B%BC%E8%B5%B7%E4%BE%86%E5%B0%B1%E6%98%AF-transformer-%E9%80%99%E5%80%8B-loop-%E7%9A%84%E4%B8%89%E5%A1%8A">拼起來，就是 Transformer <em>這個 Loop 的三塊</em></h1>
<div class="caps">
<div class="cap" data-marpit-fragment="1">
<span class="cap-emoji">👀</span>
<div class="cap-label"><span class="cap-title">注意機制</span><span class="cap-sub">Attention</span></div>
<div class="cap-div"></div>
<div class="cap-text">每個字直接看到句子裡的所有字，不必逐站傳記憶。</div>
</div>
<div class="cap" data-marpit-fragment="2">
<span class="cap-emoji">🎭</span>
<div class="cap-label"><span class="cap-title">多頭</span><span class="cap-sub">Multi-head</span></div>
<div class="cap-div"></div>
<div class="cap-text">好幾個頭同時看同一句話，各看各的，最後再合起來。</div>
</div>
<div class="cap" data-marpit-fragment="3">
<span class="cap-emoji">🕶️</span>
<div class="cap-label"><span class="cap-title">只看左邊</span><span class="cap-sub">Causal</span></div>
<div class="cap-div"></div>
<div class="cap-text">接龍時右邊的字還沒出生，每個字只看得到自己左邊。</div>
</div>
</div>
<footer>Transformer</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section data-paginate="true" data-footer="架構即樂高" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="40" style="--paginate:true;--footer:架構即樂高;--class:divider;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;/slides/sitcon-camp-26-ml-course2/assets/bg/divider-05.png&quot;);background-size:cover;"></figure></div></section></foreignObject><foreignObject width="3840" height="2160"><section id="40" data-paginate="true" data-footer="架構即樂高" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="40" style="--paginate:true;--footer:架構即樂高;--class:divider;--theme:camp-dark;" data-marpit-pagination-total="48" data-marpit-advanced-background="content"><footer>架構即樂高</footer>
</section>
</foreignObject><foreignObject width="3840" height="2160" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="架構即樂高" data-class="divider" data-theme="camp-dark" lang="C" class="divider" data-marpit-pagination="40" style="" data-marpit-pagination-total="48" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="41" data-paginate="true" data-footer="架構即樂高" data-theme="camp-dark" lang="C" data-marpit-pagination="41" style="--paginate:true;--footer:架構即樂高;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E4%B8%89%E5%80%8B%E6%9E%B6%E6%A7%8B%E5%85%B6%E5%AF%A6%E6%98%AF%E4%B8%89%E5%80%8B%E5%81%87%E8%A8%AD-mlp-%E2%86%92-rnn-%E2%86%92-transformer">三個架構，其實是三個假設 <em>MLP → RNN → Transformer</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/three_arch_glyphs.png" alt="" style="height:720px;" /></p>
<div class="cols3">
<div>
<h3 id="mlp">MLP</h3>
<p>沒有任何順序假設，句子在它眼中只是一袋字。</p>
</div>
<div>
<h3 id="rnn">RNN</h3>
<p>假設順序有意義，用一份記憶把前文一路帶著走。</p>
</div>
<div>
<h3 id="transformer">Transformer</h3>
<p>假設每個字都能直接互看，還開好幾個頭各看各的。</p>
</div>
</div>
<footer>架構即樂高</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="42" data-paginate="true" data-footer="架構即樂高" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="42" style="--paginate:true;--footer:架構即樂高;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E9%9B%B6%E4%BB%B6%E6%8B%BC%E8%B5%B7%E4%BE%86%E5%B0%B1%E6%98%AF%E5%A4%A7%E6%A8%A1%E5%9E%8B-%E9%8A%9C%E6%8E%A5%E7%AC%AC%E4%B8%89%E5%A0%82">零件拼起來，就是大模型 <em>銜接第三堂</em></h1>
<p>切塊、住址、記憶、直接互看，</p>
<p>這些零件拼起來，就是你正在用的大模型。</p>
<p>下一堂，我們拿它來<strong>玩</strong>：LoRA、生成、RL。</p>
<footer>架構即樂高</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="43" data-paginate="true" data-footer="架構即樂高" data-class="sparse" data-theme="camp-dark" lang="C" class="sparse" data-marpit-pagination="43" style="--paginate:true;--footer:架構即樂高;--class:sparse;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E5%B8%B6%E5%9B%9E%E5%AE%B6%E7%9A%84%E5%B0%8D%E7%85%A7%E8%A1%A8-%E4%BB%8A%E5%A4%A9%E5%87%BA%E7%8F%BE%E9%81%8E%E7%9A%84%E5%90%8D%E5%AD%97%E6%AF%8F%E5%80%8B%E4%B8%80%E5%8F%A5%E8%A9%B1">帶回家的對照表 <em>今天出現過的名字，每個一句話</em></h1>
<div class="cols">
<div>
<p>token<br />
<em>句子先切成的小塊，模型閱讀的單位。</em></p>
<p>tokenizer<br />
<em>負責切塊的工具。</em></p>
<p>embedding<br />
<em>給每個字一個地圖上的住址，意思像的住得近。</em></p>
<p>MLP<br />
<em>上一堂的網路，把一排數字變成答案。</em></p>
</div>
<div>
<p>RNN<br />
<em>一次讀一個字，把記憶往後傳。</em></p>
<p>attention<br />
<em>每個字直接看所有字，決定看誰、看多重。</em></p>
<p>multi-head<br />
<em>好幾個頭各看各的，最後合起來。</em></p>
<p>Transformer<br />
<em>用 attention 疊出來的架構，大模型的骨架。</em></p>
</div>
</div>
<footer>架構即樂高</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="44" data-paginate="true" data-footer="附錄" data-class="statement" data-theme="camp-dark" lang="C" class="statement" data-marpit-pagination="44" style="--paginate:true;--footer:附錄;--class:statement;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E9%99%84%E9%8C%84-%E7%B5%A6%E6%83%B3%E6%B7%B1%E6%8C%96%E7%9A%84%E4%BD%A0">附錄 <em>給想深挖的你</em></h1>
<p>接下來這幾頁<strong>課堂上不會講</strong>，</p>
<p>是留給想自己深挖的你，回家慢慢看。</p>
<p><span class="chip"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 今天所有互動站的程式碼 · <a href="https://github.com/Harrychangtw/sitcon-camp-2026-ml-pt2">github.com/Harrychangtw/sitcon-camp-2026-ml-pt2</a></span></p>
<footer>附錄</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="45" data-paginate="true" data-footer="附錄" data-theme="camp-dark" lang="C" data-marpit-pagination="45" style="--paginate:true;--footer:附錄;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="attention-%E7%9A%84%E7%9B%B2%E9%BB%9E-%E7%82%BA%E4%BB%80%E9%BA%BC%E9%9C%80%E8%A6%81%E4%BD%8D%E7%BD%AE%E8%B3%87%E8%A8%8A">attention 的盲點 <em>為什麼需要位置資訊</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/attention_orderblind.png" alt="" style="height:960px;" /></p>
<h6 id="%E5%9C%96%E6%8A%8A%E5%90%8C%E4%B8%80%E5%A0%86%E5%AD%97%E6%89%93%E6%95%A3%E9%87%8D%E6%8E%92attention-%E7%AE%97%E5%87%BA%E4%BE%86%E4%B8%80%E6%A8%A1%E4%B8%80%E6%A8%A3">圖：把同一堆字打散重排，attention 算出來一模一樣</h6>
<p>它對<strong>順序</strong>無感，<em>就像 Loop 1 的詞袋牆：「故事」和「事故」看起來一樣。</em></p>
<footer>附錄</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="46" data-paginate="true" data-footer="附錄" data-theme="camp-dark" lang="C" data-marpit-pagination="46" style="--paginate:true;--footer:附錄;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E8%A3%9C%E4%B8%81%E4%B8%80%E6%8A%8A%E9%A0%86%E5%BA%8F%E5%A1%9E%E5%9B%9E%E5%8E%BB-positional-embedding">補丁一：把順序塞回去 <em>Positional Embedding</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/pe_stripes.png" alt="" style="height:900px;" /></p>
<h6 id="%E5%9C%96%E6%AF%8F%E5%80%8B%E5%AD%97%E7%9A%84%E8%A9%9E%E8%B3%87%E8%A8%8A%E5%8A%A0%E4%B8%8A%E7%AC%AC%E5%B9%BE%E5%80%8B%E4%B8%80%E8%B5%B7%E4%B8%9F%E9%80%B2-attention">圖：每個字的「詞資訊」加上「第幾個」，一起丟進 attention</h6>
<p>attention 分不出誰前誰後，補一塊 <strong>positional embedding</strong> 把「第幾個」塞回去。</p>
<p><em>想一想：如果不塞位置資訊，把句子打亂重排，attention 會不會算出一樣的結果?</em></p>
<footer>附錄</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="47" data-paginate="true" data-footer="附錄" data-theme="camp-dark" lang="C" data-marpit-pagination="47" style="--paginate:true;--footer:附錄;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="%E8%A3%9C%E4%B8%81%E4%BA%8C%E7%B5%A6%E8%B3%87%E8%A8%8A%E4%B8%80%E6%A2%9D%E6%8D%B7%E5%BE%91-residual-connection">補丁二：給資訊一條捷徑 <em>Residual Connection</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/residual_skip.png" alt="" style="height:900px;" /></p>
<h6 id="%E5%9C%96%E6%8D%B7%E5%BE%91%E7%B9%9E%E9%81%8E%E5%B1%A4%E6%B2%92%E6%9C%89%E5%AE%83%E9%8C%AF%E8%AA%A4%E5%88%86%E6%95%B8loss%E4%BA%82%E8%B7%B3%E6%9C%89%E5%AE%83%E5%B0%B1%E7%A9%A9%E7%A4%BA%E6%84%8F%E5%9C%96">圖：捷徑繞過層；沒有它，錯誤分數（loss）亂跳，有它就穩（示意圖）</h6>
<p>網路疊得深，訓練就亂跳；補一條 <strong>residual</strong> 給資訊一條捷徑繞過層，訓練就穩。</p>
<p><em>圖示：關掉捷徑，深層訓練亂跳；補上捷徑，就穩。</em></p>
<footer>附錄</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 3840 2160"><foreignObject width="3840" height="2160"><section id="48" data-paginate="true" data-footer="附錄" data-theme="camp-dark" lang="C" data-marpit-pagination="48" style="--paginate:true;--footer:附錄;--theme:camp-dark;" data-marpit-pagination-total="48">
<h1 id="attention-%E6%80%8E%E9%BA%BC%E6%B1%BA%E5%AE%9A%E7%9C%8B%E8%AA%B0-query--key--value">attention 怎麼決定看誰 <em>Query · Key · Value</em></h1>
<p><img src="/slides/sitcon-camp-26-ml-course2/assets/figures/qkv_diagram.png" alt="" style="height:900px;" /></p>
<h6 id="%F0%9F%94%8D-query-%E6%88%91%E6%83%B3%E6%89%BE%E4%BB%80%E9%BA%BC-%F0%9F%8F%B7%EF%B8%8F-key-%E6%AF%8F%E5%80%8B%E5%AD%97%E7%9A%84%E6%A8%99%E7%B1%A4-%F0%9F%93%A6-value-%E9%82%A3%E5%80%8B%E5%AD%97%E7%9A%84%E5%85%A7%E5%AE%B9"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Query 我想找什麼　<img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f7.svg" data-marp-twemoji=""/> Key 每個字的標籤　<img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Value 那個字的內容</h6>
<p>一個字的問題對上哪把鑰匙，就多讀那個字的 <strong>內容</strong>。</p>
<p><span class="chip">🛠 poloclub.github.io/transformer-explainer</span></p>
